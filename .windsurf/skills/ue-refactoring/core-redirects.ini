; ============================================================================
; Core Redirectors Template
; Add to Config/DefaultEngine.ini when renaming classes/properties
; ============================================================================

[CoreRedirects]

; Class Redirects - When renaming a UCLASS
; +ClassRedirects=(OldName="/Script/cplus.OldClassName", NewName="/Script/cplus.NewClassName")

; Property Redirects - When renaming a UPROPERTY
; +PropertyRedirects=(OldName="OldPropertyName", NewName="NewPropertyName", MatchSubstring=True)

; Function Redirects - When renaming a UFUNCTION
; +FunctionRedirects=(OldName="OldFunctionName", NewName="NewFunctionName")

; Enum Redirects - When renaming an enum or enum value
; +EnumRedirects=(OldName="/Script/cplus.EOldEnum", NewName="/Script/cplus.ENewEnum")
; +EnumRedirects=(OldName="/Script/cplus.EMyEnum::OldValue", NewName="/Script/cplus.EMyEnum::NewValue")

; Struct Redirects - When renaming a USTRUCT
; +StructRedirects=(OldName="/Script/cplus.FOldStruct", NewName="/Script/cplus.FNewStruct")

; Package Redirects - When moving assets between packages
; +PackageRedirects=(OldName="/Game/OldPath/Asset", NewName="/Game/NewPath/Asset")

; ============================================================================
; Examples from cplus project
; ============================================================================

; Example: Renaming QuestComponent to QuestTrackerComponent
; +ClassRedirects=(OldName="/Script/cplus.UQuestComponent", NewName="/Script/cplus.UQuestTrackerComponent")

; Example: Renaming QuestID property to UniqueID
; +PropertyRedirects=(OldName="QuestID", NewName="UniqueID", MatchSubstring=True)

; Example: Renaming quest state enum value
; +EnumRedirects=(OldName="/Script/cplus.EQuestState::InProgress", NewName="/Script/cplus.EQuestState::Active")
